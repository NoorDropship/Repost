<!doctype html>
<html lang="en">

  <head>
    <script>
    /* Safe persistence fallback when file:// or sandboxed srcdoc blocks localStorage. */
    (function() {
      try {
        var s = window.localStorage;
        s.setItem('__dokkanio_test__', '1');
        s.removeItem('__dokkanio_test__');
      } catch (e) {
        var mem = {};
        var storage = {
          getItem: function(k) {
            return Object.prototype.hasOwnProperty.call(mem, k) ? mem[k] : null
          },
          setItem: function(k, v) {
            mem[k] = String(v)
          },
          removeItem: function(k) {
            delete mem[k]
          },
          clear: function() {
            mem = {}
          },
          key: function(i) {
            return Object.keys(mem)[i] || null
          }
        };
        Object.defineProperty(window, 'localStorage', {
          configurable: true,
          value: storage
        });
      }
    })();

    </script>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Dokkanio — Ecommerce Studio</title>
    <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap');

    :root {
      --ink: #191a1d;
      --muted: #85878d;
      --line: #e9e9eb;
      --paper: #fff;
      --soft: #f7f7f8;
      --accent: #6758df;
      --accent2: #8b7cf3;
      --green: #2e9d75;
      --shadow: 0 18px 60px #1717210b;
      --radius: 16px
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: #f4f4f6;
      color: var(--ink);
      font-family: 'DM Sans', sans-serif
    }

    button,
    input,
    select,
    textarea {
      font: inherit
    }

    button {
      cursor: pointer;
      border: 0
    }

    #app {
      min-height: 100vh
    }

    .topbar {
      height: 68px;
      background: #fff;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      padding: 0 24px;
      gap: 26px;
      position: sticky;
      top: 0;
      z-index: 20

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: Manrope;
      font-weight: 800;
      letter-spacing: -.5px;
      font-size: 19px

    .brand-mark {
      width: 30px;
      height: 30px;
      border-radius: 10px;
      background: linear-gradient(135deg, #6655dd, #9b8bff);
      display: grid;
      place-items: center;
      color: white;
      font-weight: 800

    .workspace-switch {
      display: flex;
      background: #f2f2f5;
      border-radius: 12px;
      padding: 4px;
      gap: 3px
    }

    .workspace-switch button {
      padding: 9px 15px;
      border-radius: 9px;
      color: #777;
      background: transparent;
      font-size: 13px;
      font-weight: 700
    }

    .workspace-switch button.active {
      background: #fff;
      color: #222;
      box-shadow: 0 2px 8px #0000000d
    }

    .top-actions {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 9px
    }

    .avatar {
      width: 33px;
      height: 33px;
      border-radius: 50%;
      background: #eee6ff;
      color: #6552cb;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 12px
    }

    .btn {
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: .15s
    }

    .btn:hover {
      transform: translateY(-1px)
    }

    .primary {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 5px 14px #6758df30
    }

    .secondary {
      background: white;
      border: 1px solid var(--line);
      color: #34343a
    }

    .quiet {
      background: #f3f3f5;
      color: #444
    }

    .danger {
      color: #bd4d4d;
      background: #fff2f2
    }

    .shell {
      display: flex;
      min-height: calc(100vh - 68px)
    }

    .side {
      width: 230px;
      background: white;
      border-right: 1px solid var(--line);
      padding: 22px 15px;
      flex-shrink: 0
    }

    .side-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1.3px;
      color: #a0a1a7;
      font-weight: 800;
      margin: 15px 10px 8px

    .navitem {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 11px 12px;
      border-radius: 10px;
      color: #686970;
      font-size: 13px;
      font-weight: 600;
      margin: 3px 0
    }

    .navitem.active {
      background: #efedff;
      color: #5c4cd2
    }

    .navicon {
      width: 20px;
      text-align: center;
      font-size: 16px
    }

    .side-bottom {
      position: sticky;
      top: 88vh;
      margin-top: 30px;
      border: 1px solid var(--line);
      padding: 13px;
      border-radius: 13px;
      background: #fafafa
    }

    .side-bottom b {
      font-size: 12px
    }

    .side-bottom p {
      font-size: 11px;
      color: #888;
      margin: 5px 0 10px
    }

    .main {
      flex: 1;
      min-width: 0;
      padding: 28px 32px
    }

    .page-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 24px
    }

    .page-head h1 {
      font: 800 26px Manrope;
      margin: 0;
      letter-spacing: -.7px
    }

    .page-head p {
      margin: 7px 0 0;
      color: #888;
      font-size: 13px
    }

    .tag {
      font-size: 11px;
      font-weight: 700;
      padding: 5px 8px;
      border-radius: 7px;
      background: #f1efff;
      color: #6453d3
    }

    .panel {
      background: white;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow)
    }

    .editor-shell {
      display: grid;
      grid-template-columns: 260px minmax(360px, 1fr) 270px;
      min-height: calc(100vh - 160px);
      overflow: hidden
    }

    .editor-left,
    .editor-right {
      background: #fff;
      padding: 18px;
      border-right: 1px solid var(--line)
    }

    .editor-right {
      border-right: 0;
      border-left: 1px solid var(--line)
    }

    .panel-title {
      font: 700 13px Manrope;
      margin-bottom: 15px
    }

    .section-row {
      border: 1px solid #ededf0;
      border-radius: 10px;
      padding: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 6px 0;
      background: #fff;
      font-size: 12px;
      font-weight: 600

    .section-row.selected {
      border-color: #8c7df2;
      background: #f6f4ff;
      box-shadow: 0 0 0 2px #8c7df222
    }

    .section-row .dots {
      color: #aaa
    }

    .section-row .remove {
      margin-left: auto;
      color: #aaa;
      background: transparent
    }

    .add-section {
      width: 100%;
      margin-top: 8px;
      border: 1px dashed #c9c5e8;
      background: #faf9ff;
      color: #6657d5;
      padding: 11px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 12px
    }

    .canvas-wrap {
      background: #e9e9ed;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 0
    }

    .canvas-toolbar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 5px;
      margin-bottom: 14px;
      background: white;
      padding: 5px;
      border-radius: 10px;
      box-shadow: 0 2px 10px #0000000c
    }

    .canvas-toolbar button {
      background: transparent;
      padding: 8px 12px;
      border-radius: 7px;
      color: #777;
      font-size: 12px
    }

    .canvas-toolbar button.active {
      background: #efedff;
      color: #5e50d3;
      font-weight: 700

    .preview {
      width: 100%;
      max-width: 960px;
      min-height: 600px;
      background: white;
      box-shadow: 0 10px 35px #00000017;
      transition: width .25s;
      overflow: hidden
    }

    .preview.mobile {
      max-width: 390px
    }

    .preview.tablet {
      max-width: 760px
    }

    .store-nav {
      height: 55px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 26px;
      border-bottom: 1px solid #eee;
      font-size: 11px
    }

    .store-nav strong {
      font: 800 16px Manrope;
      letter-spacing: -.5px
    }

    .store-nav span {
      color: #777
    }

    .hero {
      min-height: 310px;
      padding: 50px 45px;
      background: #f1eee9;
      display: flex;
      align-items: center;
      position: relative;
      outline: none
    }

    .hero.selected,
    .preview-block.selected {
      outline: 2px solid #7969e5;
      outline-offset: -2px;
      position: relative
    }

    .hero-text {
      max-width: 52%;
      z-index: 1
    }

    .hero h2 {
      font: 800 38px Manrope;
      letter-spacing: -1.6px;
      line-height: 1.05;
      margin: 0 0 14px
    }

    .hero p {
      font-size: 12px;
      color: #666;
      line-height: 1.7
    }

    .hero .shopbtn {
      padding: 12px 18px;
      border-radius: 4px;
      background: #222;
      color: white;
      font-size: 11px;
      font-weight: 700;
      margin-top: 10px
    }

    .hero-art {
      position: absolute;
      right: 30px;
      top: 22px;
      bottom: 22px;
      width: 40%;
      border-radius: 18px;
      background: linear-gradient(140deg, #e0d7ca, #c2b6a7);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden
    }

    .hero-art.has-image:before,
    .hero-art.has-image:after {
      display: none
    }

    .hero-art.has-image {
      background-color: transparent !important
    }

    .hero-art:before {
      content: '';
      width: 150px;
      height: 190px;
      border-radius: 40% 40% 18% 18%;
      background: linear-gradient(120deg, #a9a08e, #5c5549);
      box-shadow: 20px 18px 40px #0002;
      transform: rotate(-9deg)

    .hero-art:after {
      content: 'FORM / OBJECT';
      position: absolute;
      bottom: 15px;
      letter-spacing: 2px;
      font-size: 8px;
      color: #655d50
    }

    .preview-products {
      padding: 28px 25px
    }

    .preview-products h3 {
      font: 800 18px Manrope;
      margin: 0 0 18px
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px
    }

    .p-card .p-image {
      height: 135px;
      border-radius: 10px;
      background: linear-gradient(145deg, #efede8, #d8d3cc);
      display: grid;
      place-items: center;
      color: #999;
      font-size: 10px
    }

    .p-card:nth-child(2) .p-image {
      background: linear-gradient(145deg, #e9e4e0, #c8bbb3)
    }

    .p-card:nth-child(3) .p-image {
      background: linear-gradient(145deg, #e6e8e2, #c2c7bb)
    }

    .p-card b {
      display: block;
      font-size: 11px;
      margin: 8px 0 4px
    }

    .p-card small {
      color: #888;
      font-size: 10px
    }

    .preview-block {
      padding: 23px;
      text-align: center;
      border-top: 1px solid #eee;
      cursor: pointer
    }

    .preview-block h3 {
      font: 700 16px Manrope;
      margin: 0 0 7px
    }

    .preview-block p {
      color: #888;
      font-size: 11px
    }

    .field {
      margin: 13px 0
    }

    .field label {
      display: block;
      font-size: 11px;
      color: #777;
      font-weight: 700;
      margin-bottom: 7px
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      padding: 10px 11px;
      border: 1px solid #e5e5e8;
      border-radius: 9px;
      background: white;
      font-size: 12px;
      outline: none
    }

    .field textarea {
      min-height: 70px;
      resize: vertical
    }

    .field input:focus,
    .field textarea:focus,
    .field select:focus {
      border-color: #8878ed;
      box-shadow: 0 0 0 3px #8878ed1c
    }

    .color-line {
      display: flex;
      align-items: center;
      gap: 10px
    }

    .color-line input[type=color] {
      width: 40px;
      height: 35px;
      padding: 2px;
      border: 1px solid #eee;
      border-radius: 8px
    }

    .mini-note {
      font-size: 10px;
      color: #aaa;
      line-height: 1.5
    }

    .divider {
      height: 1px;
      background: var(--line);
      margin: 17px 0
    }

    .product-toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 17px
    }

    .search {
      flex: 1;
      position: relative
    }

    .search input {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      font-size: 12px
    }

    .filters {
      padding: 10px 12px;
      background: white;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: #666;
      font-size: 12px
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 13px;
      margin-bottom: 18px
    }

    .stat {
      padding: 17px
    }

    .stat small {
      font-size: 11px;
      color: #888
    }

    .stat strong {
      display: block;
      font: 800 22px Manrope;
      margin: 7px 0
    }

    .stat span {
      font-size: 10px;
      color: #369976
    }

    .product-table {
      overflow: hidden
    }

    .table-head,
    .product-row {
      display: grid;
      grid-template-columns: 40px minmax(220px, 2fr) 1fr 1fr 1fr 100px;
      gap: 12px;
      align-items: center;
      padding: 13px 17px
    }

    .table-head {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .8px;
      color: #999;
      background: #fafafa;
      border-bottom: 1px solid var(--line)
    }

    .product-row {
      border-bottom: 1px solid #f0f0f1;
      font-size: 12px
    }

    .product-row:last-child {
      border: 0
    }

    .product-info {
      display: flex;
      align-items: center;
      gap: 12px
    }

    .product-thumb {
      width: 44px;
      height: 44px;
      border-radius: 9px;
      background: linear-gradient(140deg, #e9e4dc, #c9c0b6);
      flex-shrink: 0
    }

    .product-row:nth-child(3n) .product-thumb {
      background: linear-gradient(140deg, #dfe6e1, #bcc8bf)
    }

    .product-row:nth-child(4n) .product-thumb {
      background: linear-gradient(140deg, #eee1e3, #cdb8bc)
    }

    .product-info b {
      font-size: 12px;
      display: block
    }

    .product-info small {
      color: #999;
      font-size: 10px
    }

    .stock-pill {
      background: #eaf7f1;
      color: #23835e;
      border-radius: 20px;
      padding: 5px 8px;
      font-size: 10px;
      font-weight: 700;
      display: inline-block
    }

    .low {
      background: #fff5e5;
      color: #a76b1e
    }

    .table-actions button {
      background: #f5f5f6;
      border-radius: 7px;
      padding: 7px 9px;
      color: #666
    }

    .checkout-layout {
      display: grid;
      grid-template-columns: minmax(340px, 1.2fr) minmax(300px, .8fr);
      gap: 22px
    }

    .checkout-config {
      padding: 22px
    }

    .checkout-preview-wrap {
      padding: 25px;
      background: #e9e9ed;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      border-radius: 16px
    }

    .checkout-preview {
      width: 100%;
      max-width: 390px;
      background: white;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 12px 35px #00000012
    }

    .checkout-preview .checkout-top {
      padding: 22px;
      border-bottom: 1px solid #eee;
      text-align: center
    }

    .checkout-preview .checkout-top strong {
      font: 800 17px Manrope
    }

    .checkout-body {
      padding: 20px
    }

    .checkout-body h4 {
      font: 700 13px Manrope;
      margin: 0 0 13px
    }

    .checkout-body input {
      width: 100%;
      padding: 11px;
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      margin-bottom: 9px;
      font-size: 11px
    }

    .order-line {
      display: flex;
      align-items: center;
      gap: 11px;
      margin-bottom: 12px
    }

    .order-img {
      width: 48px;
      height: 48px;
      border-radius: 9px;
      background: #e8e4dc;
      position: relative
    }

    .order-img:after {
      content: '1';
      position: absolute;
      right: -5px;
      top: -5px;
      background: #888;
      color: white;
      width: 17px;
      height: 17px;
      border-radius: 50%;
      font-size: 10px;
      display: grid;
      place-items: center
    }

    .order-line b {
      font-size: 11px
    }

    .order-line small {
      display: block;
      color: #999;
      font-size: 10px;
      margin-top: 4px
    }

    .order-line .price {
      margin-left: auto;
      font-size: 11px;
      font-weight: 700
    }

    .pay-option {
      border: 1px solid #e5e5e7;
      border-radius: 9px;
      padding: 12px;
      font-size: 11px;
      margin: 7px 0;
      display: flex;
      gap: 9px;
      align-items: center
    }

    .pay-option.active {
      border-color: #7161dd;
      background: #f7f5ff
    }

    .pay-button {
      width: 100%;
      padding: 13px;
      border-radius: 9px;
      background: #242427;
      color: white;
      font-weight: 700;
      font-size: 12px;
      margin-top: 8px
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: #17171c66;
      z-index: 80;
      display: grid;
      place-items: center;
      padding: 20px
    }

    .modal {
      background: white;
      width: min(540px, 100%);
      max-height: 92dvh;
      overflow-y: auto;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 20px 60px #0003
    }

    .catalog-choice-list {
      max-height: 210px;
      overflow: auto;
      display: grid;
      gap: 7px;
      padding: 2px
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px
    }

    .modal-head h2 {
      font: 800 20px Manrope;
      margin: 0
    }

    .modal-head button {
      background: #f2f2f4;
      border-radius: 8px;
      padding: 7px 10px
    }

    .modal-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 13px
    }

    .modal-grid .field {
      margin: 0
    }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #242427;
      color: white;
      padding: 13px 18px;
      border-radius: 12px;
      font-size: 12px;
      z-index: 100;
      box-shadow: 0 8px 30px #0003;
      animation: fade .2s
    }

    @keyframes fade {
      from {
        transform: translateY(10px);
        opacity: 0
      }

      to {
        opacity: 1
      }
    }

    .empty {
      padding: 40px;
      text-align: center;
      color: #999
    }

    .hide {
      display: none !important
    }

    @media(max-width:1150px) {
      .editor-shell {
        grid-template-columns: 220px minmax(300px, 1fr)
      }

      .editor-right {
        display: none
      }

      .side {
        width: 190px
      }

      .main {
        padding: 22px
      }
    }

    @media(max-width:800px) {
      .topbar {
        padding: 0 12px;
        gap: 10px
      }

      .brand {
        font-size: 15px
      }

      .workspace-switch button {
        padding: 8px 9px;
        font-size: 11px
      }

      .side {
        display: none
      }

      .main {
        padding: 14px
      }

      .editor-shell {
        display: block
      }

      .editor-left {
        display: none
      }

      .canvas-wrap {
        padding: 10px
      }

      .preview {
        min-height: 500px
      }

      .hero {
        padding: 30px 20px;
        min-height: 280px
      }

      .hero h2 {
        font-size: 26px
      }

      .hero-art {
        right: 10px;
        width: 38%;
        opacity: .8
      }

      .product-toolbar {
        flex-wrap: wrap
      }

      .stats {
        gap: 7px
      }

      .stat {
        padding: 12px
      }

      .stat strong {
        font-size: 18px
      }

      .table-head,
      .product-row {
        grid-template-columns: 30px minmax(140px, 1.5fr) .7fr .8fr;
        gap: 8px;
        padding: 10px
      }

      .table-head span:nth-child(4),
      .table-head span:nth-child(5),
      .product-row>div:nth-child(4),
      .product-row>div:nth-child(5) {
        display: none
      }

      .checkout-layout {
        grid-template-columns: 1fr
      }

      .page-head h1 {
        font-size: 22px
      }

      selectedSection = 'Hero',
      device = 'desktop',
      selectedProduct = null,
      productModal = false,
      products = [],
      catalogItems = [],
      productFormState = {
        is_bundle: false,

      edits = {
        heroTitle: 'Objects for slower living',
        heroSub: 'Thoughtful essentials, made to bring a little calm into your everyday.',

        accent: '#6758df',
        brand: 'FORM / OBJECT',
        button: 'Explore the collection'
      },
      history = [],
      future = [];

    function save() {
      studioSync();
      localStorage.setItem('forma_products', JSON.stringify(products));
      localStorage.setItem('forma_sections', JSON.stringify(sections));
      localStorage.setItem('forma_edits', JSON.stringify(edits));
      localStorage.setItem('forma_theme', theme)
    }
    try {
      products = JSON.parse(localStorage.getItem('forma_products')) || products;
      sections = JSON.parse(localStorage.getItem('forma_sections')) || sections;
      edits = {
        ...edits,
        ...(JSON.parse(localStorage.getItem('forma_edits')) || {})
      };
      theme = localStorage.getItem('forma_theme') || theme
    } catch (e) {
      websiteAIStatus = 'Saved settings could not be read; defaults are loaded.'
    }

    function toast(msg) {
      let t = document.createElement('div');
      t.className = 'toast';
      t.textContent = msg;
      document.body.append(t);
      setTimeout(() => t.remove(), 2400)
    }

    function snapshot() {
      history.push(JSON.stringify({
        sections,
        edits,
        products
      }));
      if (history.length > 25) history.shift();
      future = []
    }

    function undo() {
      if (!history.length) return toast('Nothing to undo');
      future.push(JSON.stringify({
        sections,
        edits,
        products
      }));
      let s = JSON.parse(history.pop());
      sections = s.sections;
      edits = s.edits;
      products = s.products;
      save();
      render()
    }

    function redo() {
      if (!future.length) return toast('Nothing to redo');
      history.push(JSON.stringify({
        sections,
        edits,
        products
      }));
      let s = JSON.parse(future.pop());
      sections = s.sections;
      edits = s.edits;
      products = s.products;
      save();
      render()
    }

    function nav() {
      return `<header class="topbar"><button class="studio-back" aria-label="Back to dashboard" onclick="try{parent.postMessage({type:'dokkanio-studio-exit'},'*')}catch(e){}">←<span class="bl"> Dashboard</span></button><div class="brand"><span class="brand-mark">D</span> Dokkanio</div><div class="workspace-switch">${[['editor','Website editor'],['products','Products'],['checkout','Checkout']].map(([v,l])=>`<button class="${workspace===v?'active':''}" onclick="switchWorkspace('${v}')">${l}</button>`).join('')}</div><div class="top-actions"><button class="btn secondary" onclick="openStorePreview()">↗ Preview</button><button class="btn primary" onclick="save();toast('Publishing changes…')">Save</button><div class="avatar">JD</div></div></header>`
    }

    function sidebar() {
      let groups = workspace === 'editor' ? sections : workspace === 'products' ? ['All products', 'Inventory', 'Collections', 'Bundles'] : ['Checkout layout', 'Customer information', 'Delivery', 'Payment', 'Order summary'];
      return `<aside class="side"><div class="side-label">Workspace</div>${[['editor','▣','Website editor'],['products','▦','Products'],['checkout','◫','Checkout']].map(([v,i,l])=>`<div class="navitem ${workspace===v?'active':''}" onclick="switchWorkspace('${v}')"><span class="navicon">${i}</span>${l}</div>`).join('')}<div class="side-label">${workspace==='editor'?'Storefront':workspace==='products'?'Catalog':'Checkout'}</div>${groups.map(g=>`<div class="navitem ${g===selected?'active':''}" onclick="selectSection('${g.replaceAll("'","\\'")}')"><span class="navicon">${workspace==='editor'?'☷':workspace==='products'?'◈':'◉'}</span>${g}</div>`).join('')}<div class="side-bottom"><b>✨ Your studio</b><p>Everything in one calm workspace. Changes are saved locally in this demo.</p><button class="btn secondary" style="width:100%" onclick="toast('Help center coming soon')">Open help center</button></div></aside>`

      return `<div class="ai-studio"><h4>✦ Website AI</h4><p>Describe the changes you want. I’ll interpret your request and apply the closest supported edits across themes, copy, banners, sections, images, product/category organization, and layout.</p><textarea id="websiteAIInput" placeholder="Example: Make this a premium tech store, use a dark navy background and teal accents, rewrite all headings, and move proof cards below products…"></textarea><div class="ai-log" id="websiteAIResult">${websiteAIStatus}</div><div class="ai-actions"><button class="btn primary" onclick="runWebsiteAI()">Understand & apply changes</button></div></div>`

    function uploadHeroImage(input, target = 'hero') {
      let file = input?.files?.[0];
      if (!file) return;
      if (!file.type.startsWith('image/')) return toast('Choose an image file');
      if (file.size > 1500000) return toast('Image must be under 1.5 MB to keep local storage reliable');
      let reader = new FileReader();
      reader.onload = () => {
        snapshot();
        if (target === 'home') {
          edits.homeImage = reader.result;
          if (!sections.includes('Image with text')) sections.push('Image with text')
        } else edits.heroImage = reader.result;
        save();
        render();
        toast(target === 'home' ? 'Homepage photo added' : 'Hero photo added')
      };
      reader.readAsDataURL(file)
    }

    function removeAIPhoto() {
      let target = document.getElementById('aiPhotoTarget')?.value || 'hero';
      snapshot();
      if (target === 'home') edits.homeImage = '';
      else edits.heroImage = '';
      save();
      render();
      toast(target === 'home' ? 'Homepage photo removed' : 'Hero photo removed')
    }

    function runWebsiteAI() {
      const input = document.getElementById('websiteAIInput'),
        raw = (input?.value || '').trim();
      if (!raw) return toast('Write what you want changed first');

        msg = [];

        if (!sections.includes(name)) {
          sections.push(name);
          msg.push('Added ' + name)
        }
      };
      const remove = (name) => {
        if (name && sections.includes(name)) {
          sections = sections.filter(x => x !== name);
          msg.push('Removed ' + name);
          if (selected === name) selected = sections[0] || ''
        }
      };
      const themes = [{
          keys: ['tech', 'technology', 'gadgets', 'electronics', 'futuristic', 'cyber', 'digital', 'gaming'],
          id: 'tech',
          title: 'Technology, made intuitive.',
          sub: 'Discover smarter devices, connected tools, and thoughtful innovations built for what comes next.',
          brand: 'NOVA / TECH',
          button: 'Explore technology',
          bg: '#111e2a',
          accent: '#20c7a5'
        },

          keys: ['luxury', 'premium', 'elegant', 'high end', 'expensive', 'editorial'],
          id: 'luxe',
          title: 'Elevated essentials, thoughtfully made.',
          sub: 'Discover timeless pieces chosen for quality, detail, and lasting style.',
          brand: 'ATELIER',
          button: 'Discover the collection',
          bg: '#ece8e1',
          accent: '#171717'
        },
        {
          keys: ['minimal', 'minimalist', 'clean', 'simple', 'monochrome'],
          id: 'mono',
          title: 'Less, considered.',
          sub: 'A refined collection of purposeful objects with nothing unnecessary.',
          brand: 'FORM',
          button: 'Explore essentials',
          bg: '#f4f4f4',
          accent: '#111111'
        },
        {
          keys: ['cute', 'kawaii', 'pastel', 'playful', 'fun', 'colorful'],
          id: 'playful',
          title: 'A little joy in every day.',
          sub: 'Colorful finds, playful details, and delightful things made to brighten your world.',
          brand: 'JOY CLUB',
          button: 'Shop the fun',
          bg: '#e7e2ff',
          accent: '#7056e8'
        },
        {
          keys: ['vintage', 'retro', 'nostalgic', 'artisan', 'handmade', 'earthy'],
          id: 'vintage',
          title: 'Made to feel timeless.',
          sub: 'Warm textures, thoughtful craft, and pieces with a story to tell.',
          brand: 'OLD SOUL',
          button: 'Discover the story',
          bg: '#eadbc6',
          accent: '#9b573b'
        },
        {
          keys: ['nature', 'botanical', 'eco', 'sustainable', 'green'],
          id: 'botanical',
          title: 'Bring nature a little closer.',
          sub: 'Considered goods inspired by natural materials and a slower way of living.',
          brand: 'FIELD & FORM',
          button: 'Explore naturally',
          bg: '#e7ede6',
          accent: '#456e54'
        },
        {
          keys: ['beach', 'coastal', 'ocean', 'sea'],
          id: 'coastal',
          title: 'Find your calmer coast.',
          sub: 'Easy essentials inspired by ocean air, open skies, and unhurried days.',
          brand: 'TIDE',
          button: 'Shop coastal',
          bg: '#d9eef0',
          accent: '#317b88'
        },
        {
          keys: ['orange', 'sunny', 'warm', 'bright'],
          id: 'sunrise',
          title: 'Make every day brighter.',
          sub: 'Fresh color, expressive pieces, and everyday favorites with energy.',
          brand: 'SUNRISE',
          button: 'Shop the edit',
          bg: '#f8dfc7',
          accent: '#e76b43'
        },
        {
          keys: ['dark', 'black', 'gold', 'noir', 'bold', 'dramatic'],
          id: 'noir',
          title: 'Made for a bold presence.',
          sub: 'Distinctive pieces, confident design, and a touch of understated drama.',
          brand: 'NOIR',
          button: 'Enter the collection',
          bg: '#171717',
          accent: '#d6b46a'
        }
      ];
      const chosen = themes.find(t => t.keys.some(k => q.includes(k)));
      if (chosen && /theme|style|design|store|website|shop|brand|redesign|look|vibe|sell|selling|create|build|turn|switch|apply/.test(q) && !/(title|heading|headline|subtitle|subheading|banner|copy|text|description|button label)/.test(q)) {
        theme = chosen.id;
        edits.heroTitle = chosen.title;
        edits.heroSub = chosen.sub;
        edits.brand = chosen.brand;
        edits.button = chosen.button;
        edits.heroBg = chosen.bg;
        edits.accent = chosen.accent;
        msg.push('Applied ' + chosen.id + ' theme, brand styling, and matching storefront copy')
      }
      // Interpret business-category descriptions even when the user doesn't explicitly say 'theme'.
      const categoryPreset = detectStorePreset(raw);
      if (categoryPreset !== storeOnboardingCopy.default && /store|shop|business|sell|selling|brand|website|site|about|products|for my/i.test(raw)) {
        theme = categoryPreset.theme;
        edits.brand = categoryPreset.brand;
        edits.heroTitle = categoryPreset.title;
        edits.heroSub = categoryPreset.sub;
        edits.button = categoryPreset.button;
        edits.heroBg = categoryPreset.bg;
        edits.accent = categoryPreset.accent;
        msg.push('Recognized store category and applied matching storefront identity')
      }
      const colorMap = {
        black: '#171717',
        white: '#ffffff',
        blue: '#3b82f6',
        teal: '#20c7a5',
        cyan: '#22d3ee',
        green: '#25865a',
        pink: '#df7294',
        red: '#e65331',
        purple: '#6758df',
        orange: '#e76b43',
        yellow: '#eab308',
        gold: '#d6b46a',
        brown: '#9b573b'
      };
      let hex = raw.match(/#[0-9a-f]{6}/i),
        color = Object.keys(colorMap).find(c => q.includes(c));
      if (hex && /(accent|color|colour|button|background)/i.test(q)) {
        edits.accent = hex[0];
        if (/hero background|background/.test(q)) edits.heroBg = hex[0];
        msg.push('Applied ' + hex[0] + ' color')
      } else if (color && /(accent|color|colour|button|background)/i.test(q)) {
        edits.accent = colorMap[color];
        if (/hero background|background/.test(q)) edits.heroBg = colorMap[color];
        msg.push('Updated color to ' + color)
      }
      const extract = (regex) => {
        let m = raw.match(regex);
        return m && m[1] ? m[1].trim().replace(/^['“"]|['“"]$/g, '') : ''
      };
      let value = extract(/(?:hero\s*)?(?:title|headline|heading)\s*(?:to|as|=|:|with)\s*(.+)$/i);
      if (value) {
        edits.heroTitle = value;
        msg.push('Changed hero heading')
      }
      value = extract(/(?:hero\s*)?(?:subtitle|subheading|description|intro|tagline)\s*(?:to|as|=|:|with)\s*(.+)$/i);
      if (value) {
        edits.heroSub = value;
        msg.push('Changed hero subheading')
      }
      value = extract(/(?:store\s*name|brand\s*name|brand)\s*(?:to|as|=|:|with)\s*(.+)$/i);
      if (value) {
        edits.brand = value;
        msg.push('Changed store name')
      }
      value = extract(/(?:button\s*(?:text|label)?|cta)\s*(?:to|as|=|:|with)\s*(.+)$/i);
      if (value) {
        edits.button = value;
        msg.push('Changed button label')
      }
      value = extract(/(?:announcement|banner|shipping banner|top banner|announcement bar)(?:\s*(?:text|message|copy))?\s*(?:to|as|=|:|with)\s*(.+)$/i);
      if (value) {
        edits.bannerText = value;
        msg.push('Changed announcement banner')
      }
      value = extract(/(?:brand story|about section|about us)(?:\s*(?:heading|title))?\s*(?:to|as|=|:|with)\s*(.+)$/i);
      if (value) {
        edits.sectionTitles = edits.sectionTitles || {};
        edits.sectionTitles['Brand story'] = value;
        msg.push('Changed Brand story heading')
      }
      value = extract(/(?:brand story|about section|about us)(?:\s*(?:text|copy|description|paragraph))\s*(?:to|as|=|:|with)\s*(.+)$/i);
      if (value) {
        edits.sectionTexts = edits.sectionTexts || {};
        edits.sectionTexts['Brand story'] = value;
        msg.push('Changed Brand story text')
      }
      // General section-level copy editing: supports headings/titles and descriptions/text for any named section.
      const sectionNames = ['Announcement bar', 'Header', 'Hero', 'Featured products', 'Brand story', 'Proof cards', 'Testimonials', 'FAQ', 'Newsletter', 'Gallery', 'Image with text', 'Collection grid', 'Contact', 'Video', 'Blog', 'Logo wall', 'Custom content', 'Rich text', 'Footer'];
      const sectionTarget = sectionNames.sort((a, b) => b.length - a.length).find(name => q.includes(name.toLowerCase()));
      const genericHead = raw.match(/(?:set|change|rewrite|update)\s+(?:the\s+)?(.+?)\s+(?:heading|title|headline)\s+(?:to|as|=)\s+(.+)$/i);
      const genericText = raw.match(/(?:set|change|rewrite|update)\s+(?:the\s+)?(.+?)\s+(?:text|copy|description|paragraph|subheading)\s+(?:to|as|=)\s+(.+)$/i);
      if (genericHead) {
        let sec = sectionNames.find(n => n.toLowerCase() === genericHead[1].trim().toLowerCase()) || sectionTarget;
        if (sec) {
          edits.sectionTitles = edits.sectionTitles || {};
          edits.sectionTitles[sec] = genericHead[2].trim();
          msg.push('Updated ' + sec + ' heading')
        }
      }
      if (genericText) {
        let sec = sectionNames.find(n => n.toLowerCase() === genericText[1].trim().toLowerCase()) || sectionTarget;
        if (sec) {
          edits.sectionTexts = edits.sectionTexts || {};
          edits.sectionTexts[sec] = genericText[2].trim();
          msg.push('Updated ' + sec + ' copy')
        }
      }
      // Natural phrasing variants for exact copy changes.
      const flexibleTitle = raw.match(/(?:make|change|set|rewrite|update)\s+(?:the\s+)?(?:hero\s+)?(?:title|heading|headline)\s+(?:say|to|as|with)\s+(.+)$/i) || raw.match(/(?:hero\s+)?(?:title|heading|headline)\s*(?:is|should be)\s+(.+)$/i);
      if (flexibleTitle && !value) {
        edits.heroTitle = flexibleTitle[1].trim().replace(/^['“"]|['“"]$/g, '');
        msg.push('Updated hero title from natural-language instruction')
      }
      const flexibleSub = raw.match(/(?:make|change|set|rewrite|update)\s+(?:the\s+)?(?:hero\s+)?(?:subheading|subtitle|description|tagline)\s+(?:say|to|as|with)\s+(.+)$/i);
      if (flexibleSub) {
        edits.heroSub = flexibleSub[1].trim();
        msg.push('Updated hero subheading')
      }
      const generalRewrite = /rewrite|refresh|improve|make .*more|sound more|copywriting|write new/i.test(q);
      if (generalRewrite && !flexibleTitle && !flexibleSub && /hero|headline|heading|subtitle|subheading|description|copy|text|all text|whole website|entire site/i.test(q)) {
        if (/hero|headline|heading|title/i.test(q)) {
          edits.heroTitle = chosen?.title || edits.heroTitle;
          edits.heroSub = chosen?.sub || edits.heroSub;
          msg.push('Refreshed hero copy using the detected store style')
        }
        if (/brand story|about/i.test(q)) {
          edits.sectionTexts = edits.sectionTexts || {};
          edits.sectionTexts['Brand story'] = categoryPreset.sub;
          msg.push('Refreshed Brand story copy')
        }
        if (/all text|whole website|entire site/i.test(q)) {
          edits.sectionTexts = edits.sectionTexts || {};
          sections.forEach(sec => {
            if (!['Header', 'Footer', 'Hero', 'Announcement bar'].includes(sec)) edits.sectionTexts[sec] = categoryPreset.sub
          });
          edits.bannerText = 'Discover ' + categoryPreset.brand + ' — thoughtfully selected for you';
          msg.push('Refreshed copy across storefront sections and banner')
        }
      }
      // Image intent: choose from the owner's bundled image library and match the prompt category.
      const imageMap = [{
          keys: ['tech', 'technology', 'electronics', 'electronic', 'gadget', 'computer', 'phone', 'camera', 'gaming', 'device'],
          url: FORMA_IMAGES.tech,
          label: 'tech'
        },
        {
          keys: ['fashion', 'clothing', 'apparel', 'shirt', 'dress', 'streetwear', 'wear'],
          url: FORMA_IMAGES.fashion,
          label: 'fashion'
        },
        {
          keys: ['food', 'restaurant', 'meal', 'dish', 'cafe', 'coffee', 'bakery', 'snack'],
          url: FORMA_IMAGES.food,
          label: 'food'
        },
        {
          keys: ['beauty', 'skincare', 'skin care', 'cosmetic', 'makeup', 'dreamy', 'pastel', 'pink'],
          url: FORMA_IMAGES.dreamy,
          label: 'beauty / dreamy'
        },
        {
          keys: ['home', 'furniture', 'interior', 'living', 'decor', 'decoration'],
          url: FORMA_IMAGES.home,
          label: 'home'
        },
        {
          keys: ['nature', 'garden', 'plant', 'eco', 'botanical'],
          url: FORMA_IMAGES.dreamy,
          label: 'nature'
        }
      ];
      const blankImageIntent = /(no image|without image|image off|blank image|leave blank|remove (the )?(hero|home|homepage)? ?image|clear (the )?(hero|home|homepage)? ?image|don't use (an )?image|do not use (an )?image)/i.test(raw);
      const photoIntent = /(add|change|replace|update|put|use|set|choose|show|generate|make|pick|upload|swap).{0,90}(photo|image|picture|visual|banner image)|(?:photo|image|picture|visual).{0,70}(hero|homepage|home page|add|change|replace|update|tech|fashion|food|beauty|home|store|banner)|\b(image|photo|picture)\b/i.test(raw);
      const categoryImage = imageMap.find(x => x.keys.some(k => q.includes(k)));
      const categoryRedesign = chosen && /(store|shop|website|site|redesign|make|turn|create|build|style|theme)/i.test(raw);
      if (blankImageIntent) {
        edits.heroImage = '';
        edits.homeImage = '';
        msg.push('Removed storefront images as requested')
      } else if (photoIntent || categoryRedesign) {
        let storePreset = detectStorePreset(edits.storeIdea || ''),
          im = categoryImage || imageMap.find(x => x.label === storePreset.imageKey) || imageMap.find(x => x.label === 'tech');
        let url = im?.url || FORMA_IMAGES.dreamy;
        if (/home ?page|homepage|image with text|home image|section image/i.test(q)) {
          edits.homeImage = url;
          if (!sections.includes('Image with text')) add('Image with text')
        } else edits.heroImage = url;
        msg.push('Selected a ' + (im?.label || 'matching') + ' image from the built-in image choices')
      }
      if (!blankImageIntent && /(photo|image|picture|visual)/i.test(raw) && /(add|change|replace|use|show|put|set|upload|make|choose|pick)/i.test(raw) && !categoryImage) {
        let fallbackPreset = detectStorePreset(raw);
        if (fallbackPreset.image && fallbackPreset.imageKey !== 'none') {
          if (/home ?page|homepage|home page|section image/i.test(q)) {
            edits.homeImage = fallbackPreset.image;
            if (!sections.includes('Image with text')) add('Image with text')
          } else edits.heroImage = fallbackPreset.image;
          msg.push('Matched photo to detected store category')
        }
      }
      // Section aliases, with specific terms first so partial words do not mis-target.
      const aliases = {
        'announcement bar': 'Announcement bar',
        'banner': 'Announcement bar',
        'testimonials': 'Proof cards',
        'testimonial': 'Proof cards',
        'reviews': 'Proof cards',
        'review section': 'Proof cards',
        'proof': 'Proof cards',
        'social proof': 'Proof cards',
        'trust badges': 'Proof cards',
        'faq': 'FAQ',
        'frequently asked questions': 'FAQ',
        'newsletter': 'Newsletter',
        'email signup': 'Newsletter',
        'brand story': 'Brand story',
        'about us': 'Brand story',
        'featured products': 'Featured products',
        'product grid': 'Featured products',
        'collection grid': 'Collection grid',
        'gallery': 'Gallery',
        'image with text': 'Image with text',
        'contact': 'Contact',
        'video': 'Video',
        'blog': 'Blog',
        'logo wall': 'Logo wall',
        'custom content': 'Custom content',
        'rich text': 'Rich text',
        'header': 'Header',
        'hero': 'Hero',
        'footer': 'Footer'
      };
      const aliasKey = Object.keys(aliases).sort((a, b) => b.length - a.length).find(k => q.includes(k));
      let target = aliasKey ? aliases[aliasKey] : sections.find(s => q.includes(s.toLowerCase()));
      if (/add|create|insert|include|show|put|make/.test(q)) {
        if (target) add(target);
        else if (/home\s*page|homepage/.test(q) && /(image|photo|picture)/.test(q)) add('Image with text');
        else {
          let m = raw.match(/(?:add|create|insert)\s+(?:a\s+)?(?:custom\s+)?(?:section|block)\s+(?:called|named)\s*["“]?([\w &-]{2,40})["”]?$/i);
          if (m) add(m[1].trim())
        }
      }
      if (/remove|delete|hide|take out|disable/.test(q) && !/(image|photo|picture)/.test(q)) {
        if (target) remove(target);
        else if (/all optional/.test(q)) {
          sections = sections.filter(x => ['Header', 'Hero', 'Footer'].includes(x));
          msg.push('Removed optional sections')
        }
      }
      if (/\bmove\b|\breorder\b|\babove\b|\bbelow\b|\bbefore\b|\bafter\b|\bfirst\b|\blast\b|\btop\b|\bbottom\b/.test(q) && target && sections.includes(target)) {
        sections = sections.filter(x => x !== target);
        let pos = /first|top/.test(q) ? 0 : /last|bottom/.test(q) ? sections.length : Math.max(0, sections.indexOf(/below|after/.test(q) ? 'Hero' : 'Header') + 1);
        sections.splice(pos, 0, target);
        msg.push('Moved ' + target)
      }
      if (/feature|featured product|show product|product on homepage/.test(q)) {
        let found = products.filter(p => q.includes(p.name.toLowerCase()));
        if (found.length) {
          edits.featuredIds = edits.featuredIds || [];
          if (/only|just|replace/.test(q)) edits.featuredIds = [];
          found.forEach(p => {
            if (!edits.featuredIds.includes(p.id)) edits.featuredIds.push(p.id)
          });
          if (!sections.includes('Featured products')) sections.push('Featured products');
          msg.push('Featured ' + found.map(p => p.name).join(', '))
        } else if (/all products|automatic/.test(q)) {
          edits.featuredIds = [];
          msg.push('Restored automatic product selection')
        }
      }
      if (/remove|clear|delete/.test(q) && /image|photo|picture/.test(q)) {
        if (/home|image with text/.test(q)) edits.homeImage = '';
        else edits.heroImage = '';
        msg.push('Removed image')
      }
      if (/sort|organize|order|group/.test(q) && /categor|product|collection/.test(q)) {
        products.sort((a, b) => String(a.category || 'Uncategorized').localeCompare(String(b.category || 'Uncategorized')) || String(a.name || '').localeCompare(String(b.name || '')));
        productSortByCategory = true;
        msg.push('Sorted products by category, then name')
      }
      const rename = raw.match(/(?:rename|change|set)\s+(?:product\s*)?categor(?:y|ies)\s+(.+?)\s+(?:to|as|=)\s+(.+)$/i);
      if (rename) {
        let old = rename[1].trim(),
          next = rename[2].trim();
        let count = 0;
        products.forEach(p => {
          if (String(p.category).toLowerCase() === old.toLowerCase()) {
            p.category = next;
            count++
          }
        });
        if (count) msg.push('Renamed ' + count + ' product categor' + (count === 1 ? 'y' : 'ies') + ' from ' + old + ' to ' + next);
        else msg.push('No products found in category ' + old)
      }
      if (/reset|start over/.test(q) && /store|design|website|all/.test(q)) {
        theme = 'classic';
        edits = {
          ...edits,
          heroTitle: 'Objects for slower living',
          heroSub: 'Thoughtful essentials, made to bring a little calm into your everyday.',
          heroBg: '#f1eee9',
          accent: '#6758df',
          button: 'Explore the collection',
          heroImage: '',
          homeImage: '',
          featuredIds: []
        };
        sections = ['Announcement bar', 'Header', 'Hero', 'Featured products', 'Brand story', 'Proof cards', 'Footer'];
        selected = 'Hero';
        msg.push('Reset storefront')
      }
      websiteAIStatus = msg.length ? msg.join('. ') : 'No matching changes found. Try “make the store futuristic”, “change the banner to Free shipping today”, “add a fashion photo to the homepage”, “set hero title to …”, “sort products by category”, or “rename category Accessories to Jewelry”.';
      save();
      render();
      toast(websiteAIStatus)
    }

      render();
      toast('Store style applied')
    }

    function setProductFilter(v) {
      productFilter = v;
      renderProductsOnly()
    }

    function setSort(v) {
      sortMode = v;
      renderProductsOnly()
    }

    function productFiltered() {
      let q = document.getElementById('productSearch')?.value?.toLowerCase() || '';
      let a = products.filter(p => p.name.toLowerCase().includes(q));
      if (selected === 'Bundles') a = a.filter(p => p.is_bundle || p.category === 'Bundles');
      if (productFilter === 'Active' || productFilter === 'Draft') a = a.filter(p => p.status === productFilter);
      if (productFilter === 'stock') a = a.filter(p => p.stock > 0);
      if (productFilter === 'out') a = a.filter(p => p.stock === 0);
      if (sortMode === 'name') a.sort((x, y) => x.name.localeCompare(y.name));
      if (sortMode === 'priceAsc') a.sort((x, y) => x.price - y.price);
      if (sortMode === 'priceDesc') a.sort((x, y) => y.price - x.price);
      if (sortMode === 'stock') a.sort((x, y) => y.stock - x.stock);
      return a
    }

    function renderProductsOnly() {
      let rows = document.getElementById('productRows');
      if (rows) rows.innerHTML = productRows(productFiltered())
    }

    function parseVariantGroups(raw) {
      return String(raw || '').split(/\n|;/).map(line => line.trim()).filter(Boolean).map(line => {
        let idx = line.indexOf(':');
        if (idx < 0) return {
          name: 'Option',
          values: line.split(/,|·/).map(x => x.trim()).filter(Boolean)
        };
        return {
          name: line.slice(0, idx).trim(),
          values: line.slice(idx + 1).split(/,|·/).map(x => x.trim()).filter(Boolean)
        }
      }).filter(g => g.values.length)
    }

    function openProductDetail(id) {
      let p = products.find(x => x.id === id);
      if (!p) return;
      document.getElementById('productDetailModal')?.remove();
      let modal = document.createElement('div');
      modal.className = 'modal-backdrop';
      modal.id = 'productDetailModal';
      let claims = (p.certifications || '').split(',').map(x => x.trim()).filter(Boolean);
      let items = Array.isArray(p.bundleProductIds) ? p.bundleProductIds.map(id => catalogItems.find(item => String(item.id) === String(id))).filter(Boolean) : [];
      let groups = parseVariantGroups(p.variants);
      let variantHtml = groups.length ? groups.map((g, i) => `<div class="variant-group"><label><span>${g.name}</span><span class="mini-note">Choose ${g.name.toLowerCase()}</span></label><select data-variant-group="${i}" onchange="updateProductVariantSummary(${p.id})"><option value="">Select ${g.name}</option>${g.values.map(v=>`<option value="${v.replace(/"/g,'&quot;')}">${v}</option>`).join('')}</select></div>`).join('') : '<div class="mini-note">No variations configured. Edit product to add options.</div>';
      modal.innerHTML = `<div class="product-detail"><div class="detail-closebar"><button class="btn secondary" onclick="document.getElementById('productDetailModal').remove()">Close ✕</button></div><div class="detail-grid"><div class="detail-visual" ${p.image?`style="background-image:url('${p.image.replace(/'/g,'%27')}');background-size:cover;background-position:center;color:transparent"`:''}>✧</div><div class="detail-content"><div class="tag">${escapeStudioHTML(p.category||'Product')}</div><h2>${escapeStudioHTML(p.name)}</h2><div class="detail-price" id="detailPrice">BDT ${Number(p.price).toFixed(2)}</div>${normalizeQuantityDiscounts(p.quantity_discounts).length?`<div class="detail-section" style="border:1px solid #ccebdd;background:#f2faf6;border-radius:12px;padding:12px"><h4>Multi-buy savings</h4>${normalizeQuantityDiscounts(p.quantity_discounts).map(deal=>`<p class="mini-note">Buy ${deal.quantity} or more · save ${deal.discount_percent}%</p>`).join('')}</div>`:''}<div class="detail-stock" style="color:${p.stock>0?'#28815e':'#b94b4b'}">${p.stock>0?`${p.stock} available`:'Currently out of stock'}</div><div class="detail-description-box"><h4>Product description</h4><p>${escapeStudioHTML(p.description||'Add a detailed description to help customers understand the materials, features, and story behind this product.')}</p></div><div class="detail-section"><h4>Choose your options</h4>${variantHtml}<div id="variantSummary" class="mini-note"></div></div>${p.is_bundle?`<div class="detail-section"><h4>Bundle · what&apos;s included (${items.length})</h4>${items.length?items.map(item=>`<button type="button" class="bundle-item-button" onclick="openBundleItemDetail('${escapeStudioHTML(item.id)}')"><span>${escapeStudioHTML(item.name)}</span><span>View item →</span></button>`).join(''):'<div class="mini-note">Bundle items have not been selected yet.</div>'}</div>`:''}${claims.length?`<div class="detail-section"><h4>Certifications & product claims</h4>${claims.map(x=>`<span class="detail-badge">✦ ${escapeStudioHTML(x)}</span>`).join('')}</div>`:`<div class="detail-section"><h4>Certifications & claims</h4><div class="mini-note">No certifications or claims listed.</div></div>`}<div class="detail-quantity"><button onclick="changeDetailQty(-1)">−</button><input id="detailQty" type="number" min="1" max="${Math.max(1,p.stock)}" value="1" onchange="changeDetailQty(0)"><button onclick="changeDetailQty(1)">+</button><span class="mini-note">Quantity</span></div><div class="detail-actions"><button class="btn secondary" onclick="editProduct(${p.id});document.getElementById('productDetailModal').remove()">Edit product</button><button class="btn primary" ${p.stock<=0?'disabled style="opacity:.5"':''} onclick="addDemoCart(${p.id},document.getElementById('detailQty')?.value||1)">Add to cart</button></div><div class="detail-footnote">Secure checkout · Carefully packed · Support available</div></div></div></div>`;
      document.body.append(modal);
      window.currentDetailProductId = id;
      window.currentDetailBasePrice = Number(p.price) || 0;
    }

    function openBundleItemDetail(catalogId) {
      const item = catalogItems.find(entry => String(entry.id) === String(catalogId));
      if (!item) return;
      document.getElementById('bundleItemModal')?.remove();
      const modal = document.createElement('div');
      modal.className = 'modal-backdrop';
      modal.id = 'bundleItemModal';
      modal.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="bundleItemTitle"><div class="modal-head"><h2 id="bundleItemTitle">${escapeStudioHTML(item.name)}</h2><button type="button" aria-label="Close item details" onclick="document.getElementById('bundleItemModal').remove()">✕</button></div><p class="mini-note">${escapeStudioHTML(item.category||'Catalog item')} · BDT ${Number(item.price||0).toLocaleString()}</p><p class="detail-description" style="margin:16px 0">${escapeStudioHTML(item.description||'Included in this bundle.')}</p><button type="button" class="btn secondary" onclick="document.getElementById('bundleItemModal').remove()">Back to bundle</button></div>`;
      document.body.append(modal)
    }

    function updateProductVariantSummary(id) {
      let modal = document.getElementById('productDetailModal');
      if (!modal) return;
      let selections = [...modal.querySelectorAll('[data-variant-group]')].map(sel => sel.value).filter(Boolean);
      let out = document.getElementById('variantSummary');
      if (out) out.textContent = selections.length ? 'Selected: ' + selections.join(' · ') : 'Choose options above';
    }

    function changeDetailQty(delta) {
      let input = document.getElementById('detailQty');
      if (!input) return;
      let product = products.find(x => x.id === window.currentDetailProductId);
      let max = Math.max(1, product?.stock || 1);
      input.value = Math.max(1, Math.min(max, (Number(input.value) || 1) + delta));
    }

    let demoCart = JSON.parse(localStorage.getItem('forma_cart') || '[]');

    function addDemoCart(id, qty = 1) {
      let p = products.find(x => x.id === id);
      qty = Math.max(1, Math.min(Number(qty) || 1, p?.stock || 1));
      if (!p || p.stock < 1) return toast('Product is out of stock');
      let chosen = [...(document.querySelectorAll('#productDetailModal [data-variant-group]') || [])].map(sel => {
        let g = parseVariantGroups(p.variants)[Number(sel.dataset.variantGroup)];
        return sel.value ? `${g?.name||'Option'}: ${sel.value}` : ''
      }).filter(Boolean);
      let key = id + '|' + chosen.join('|');
      let item = demoCart.find(x => x.key === key);
      if (item) item.qty += qty;
      else demoCart.push({
        key,
        id,
        name: p.name,
        price: p.price,
        qty,
        variants: chosen
      });
      localStorage.setItem('forma_cart', JSON.stringify(demoCart));
      toast('Added to demo cart')
    }

    function openStorePreview() {
      let w = window.open('', 'forma-preview', 'width=1200,height=850');
      if (!w) return toast('Allow popups to open preview');
      const preview = document.getElementById('preview')?.cloneNode(true);
      if (preview) {
        preview.classList.remove('selected');
        preview.querySelectorAll('.selected').forEach(element => element.classList.remove('selected'));
        preview.querySelectorAll('[onclick]').forEach(element => element.removeAttribute('onclick'))
      }
      const markup = preview?.outerHTML || `<div class="preview">${storePreview()}</div>`;
      const styles = [...document.querySelectorAll('style')].map(style => style.textContent).join('\n');
      w.document.open();

    function removeSection(s) {
      if (!sections.includes(s)) return;
      snapshot();
      sections = sections.filter(x => x !== s);
      selected = sections[0] || '';
      save();
      render();
      toast('Removed ' + s)
    }

    function addSection() {
      let options = ['Image with text', 'FAQ', 'Newsletter', 'Collection grid', 'Video', 'Custom content', 'Contact'];
      let s = prompt('Choose a section name:\n' + options.join('\n'), options[0]);
      if (!s) return;
      snapshot();
      sections.push(s);
      selected = s;
      save();
      render()
    }
    let dragged = '';

    function dragSection(e, s) {
      dragged = s;
      if (e.dataTransfer) {
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', s)
      }
    }

    function allowSectionDrop(e) {
      e.preventDefault();
      if (e.dataTransfer) e.dataTransfer.dropEffect = 'move'
    }

    function dropSection(e, target) {
      e.preventDefault();
      let s = e.dataTransfer?.getData('text/plain') || dragged;
      if (!s || s === target) return;
      moveSectionBefore(s, target)
    }

    function moveSectionBefore(s, target) {
      let from = sections.indexOf(s),
        to = sections.indexOf(target);
      if (from < 0 || to < 0 || from === to) return;
      snapshot();
      sections.splice(from, 1);
      to = sections.indexOf(target);
      sections.splice(to, 0, s);
      selected = s;
      save();
      render();
      toast('Section reordered')
    }

    function moveSection(s, delta) {
      let i = sections.indexOf(s),
        j = i + delta;
      if (i < 0 || j < 0 || j >= sections.length) return;
      snapshot();
      sections.splice(i, 1);
      sections.splice(j, 0, s);
      selected = s;
      save();
      render();
      toast('Section moved')
    }

    function escapeStudioHTML(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      } [char]))
    }

    function normalizeQuantityDiscounts(value) {
      if (!Array.isArray(value)) return [];
      const used = new Set();
      return value.map(deal => ({
        quantity: Number(deal?.quantity),
        discount_percent: Number(deal?.discount_percent)
      })).filter(deal => {
        if (!Number.isInteger(deal.quantity) || deal.quantity < 2 || deal.quantity > 99 || !Number.isInteger(deal.discount_percent) || deal.discount_percent < 1 || deal.discount_percent > 90 || used.has(deal.quantity)) return false;
        used.add(deal.quantity);
        return true
      }).sort((a, b) => a.quantity - b.quantity)
    }

    function renderStudioDiscountRows() {
      const rows = document.getElementById('studioDiscountRows');
      if (!rows) return;
      rows.innerHTML = productFormState.quantityDiscounts.map((deal, index) => `<div class="grid grid-cols-[1fr_1fr_auto] items-end gap-2"><label class="field"><span>Buy quantity</span><input type="number" min="2" max="99" step="1" required value="${deal.quantity}" oninput="updateStudioDiscountTier(${index},'quantity',this.value)"></label><label class="field"><span>Discount %</span><input type="number" min="1" max="90" step="1" required value="${deal.discount_percent}" oninput="updateStudioDiscountTier(${index},'discount_percent',this.value)"></label><button type="button" class="btn danger" aria-label="Remove discount tier" onclick="removeStudioDiscountTier(${index})">Remove</button></div>`).join('') || '<div class="mini-note">No multi-buy offers yet.</div>';
      const add = document.getElementById('studioDiscountAdd');
      if (add) add.disabled = productFormState.quantityDiscounts.length >= 3
    }

    function updateStudioDiscountTier(index, key, value) {
      if (!productFormState.quantityDiscounts[index]) return;
      productFormState.quantityDiscounts[index][key] = Number(value)
    }

    function addStudioDiscountTier() {
      if (productFormState.quantityDiscounts.length >= 3) return toast('Up to three quantity offers are supported');
      const quantity = Math.max(1, ...productFormState.quantityDiscounts.map(deal => Number(deal.quantity) || 1)) + 1;
      productFormState.quantityDiscounts.push({
        quantity: Math.max(2, quantity),
        discount_percent: 10
      });
      renderStudioDiscountRows()
    }

    function removeStudioDiscountTier(index) {
      productFormState.quantityDiscounts.splice(index, 1);
      renderStudioDiscountRows()
    }

.id)}')"><span>${escapeStudioHTML(item.name)}</span><span>BDT ${Number(item.price||0).toLocaleString()}</span></button>`).join('')||'<div class="mini-note">Add another catalog product to build a bundle.</div>'}</div></div><fieldset class="field" style="grid-column:1/-1;border:0;padding:0;margin:0"><legend>Product variations?</legend><div class="choice-row"><button type="button" aria-pressed="${productFormState.has_variations}" data-option="variations" class="${productFormState.has_variations?'active':''}" onclick="setProductOption('has_variations',true)">Yes, add options</button><button type="button" aria-pressed="${!productFormState.has_variations}" data-option="variations" class="${!productFormState.has_variations?'active':''}" onclick="setProductOption('has_variations',false)">No</button></div></fieldset><div id="variationFields" class="field" style="grid-column:1/-1" ${productFormState.has_variations?'':'hidden'}><label for="mVariants">Variation options</label><input id="mVariants" value="${escapeStudioHTML(p?.variants||'')}" placeholder="Color: Black, White · Size: S, M, L"></div><fieldset class="field" style="grid-column:1/-1;border:0;padding:0;margin:0"><legend>Quantity discounts</legend><div class="mini-note">Set up to three multi-buy offers, such as buy 2 and save 10%.</div><div id="studioDiscountRows" style="display:grid;gap:8px;margin-top:10px"></div><button id="studioDiscountAdd" type="button" class="btn secondary" style="margin-top:8px" onclick="addStudioDiscountTier()">＋ Add quantity tier</button></fieldset><div class="field" style="grid-column:1/-1"><label for="mDescription">Description</label><textarea id="mDescription" placeholder="A short product description">${escapeStudioHTML(p?.description||'')}</textarea><div class="mini-note">Auto-filled from the catalog. You can edit it.</div></div></div><div class="divider"></div><div style="display:flex;justify-content:flex-end;gap:9px"><button type="button" class="btn secondary" onclick="closeProductModal(     function completeStudioProductSave(record) {
      const request = pendingStudioProduct;
      if (!request) return;
      const catalog = catalogItems.find(item => String(item.id) === String(request.catalogId));
      if (!catalog) return;
      const product = {
        ...catalog,
        ...record,
        catalogId: String(request.catalogId),
        sid: record.sid || '',
        name: catalog.name,
        category: catalog.category || 'Catalog',
        price: request.price,
        stock: record.stock ?? 99,
        status: 'Active',
        is_bundle: request.is_bundle,
        variants: request.variants,
        description: request.description,
        bundleProductIds: request.bundleProductIds,
        quantity_discounts: request.quantity_discounts,
        bundle: request.bundleProductIds.map(id => catalogItems.find(item => String(item.id) === String(id))?.name || '').filter(Boolean).join('\n'),
        certifications: request.certifications || '',
        image: record.image || catalog.image || ''
      };
      snapshot();
      const index = products.findIndex(item => item.sid && item.sid === product.sid || item.catalogId === product.catalogId);
      if (index >= 0) products[index] = product;
      else products.unshift(product);
      pendingStudioProduct = null;
      save();
      closeProductModal();
      render();
      toast('Product saved')
    }

    function saveProduct(id) {
      const catalogId = document.getElementById('mCatalog')?.value || selectedProduct?.catalogId;
      const catalog = catalogItems.find(item => String(item.id) === String(catalogId));
      if (!catalog) return toast('Choose a product from the catalog');
      const price = Number(document.getElementById('mPrice')?.value);
      if (!Number.isFinite(price) || price < 0) return toast('Enter a valid store price');
      const bundleProductIds = productFormState.is_bundle ? productFormState.bundleProductIds.filter((item, index, array) => String(item) !== String(catalogId) && array.indexOf(item) === index).slice(0, 20) : [];
      if (productFormState.is_bundle && !bundleProductIds.length) return toast('Choose at least one catalog item for the bundle');
      const variants = productFormState.has_variations ? document.getElementById('mVariants')?.value.trim() || '' : '';
      if (productFormState.has_variations && !variants) return toast('Add at least one variation option');
      const quantityDiscounts = normalizeQuantityDiscounts(productFormState.quantityDiscounts);
      if (quantityDiscounts.length !== productFormState.quantityDiscounts.length) return toast('Use unique quantities from 2–99 and discounts from 1–90%.');
      const description = document.getElementById('mDescription')?.value.trim().slice(0, 2000) || catalog.description || `${catalog.name} — a thoughtfully selected ${String(catalog.category||'catalog').toLowerCase()} item from ${catalog.brand||'our catalog'}.`;
      const requestId = `${Date.now()}-${Math.random().toString(36).slice(2,8)}`;
      pendingStudioProduct = {
        requestId,
        catalogId: String(catalogId),
        price,
        is_bundle: productFormState.is_bundle,
        bundleProductIds,
        variants,
        description,
        quantity_discounts: quantityDiscounts
      };
      const button = document.getElementById('saveProductButton');
      if (button) {
        button.disabled = true;
        button.textContent = 'Saving…'
      }
      if (parent === window) {
        completeStudioProductSave({
          id: id || Date.now(),
          name: catalog.name,
          category: catalog.category,
          price,
          stock: 99,
          status: 'Active',
          image: catalog.image || '',
          description,
          variants,
          bundleProductIds,
          quantity_discounts: quantityDiscounts
        });
        return
      }
      parent.postMessage({
        type: 'dokkanio-studio-product-save',
        requestId,
        sid: selectedProduct?.sid || '',
        catalogId: String(catalogId),
        price,
        is_bundle: productFormState.is_bundle,
        bundleProductIds,
        variants,
        description,
        quantity_discounts: quantityDiscounts,
        image_url: catalog.image || ''
      }, '*')
    }

    function detectStorePreset(text) {
      let t = String(text || '').toLowerCase();
      let scores = {
        tech: 0,
        fashion: 0,
        beauty: 0,
        home: 0,
        food: 0,
        jewelry: 0,
        playful: 0
      };
      const words = {
        tech: ['tech', 'technology', 'electronic', 'electronics', 'gadget', 'computer', 'phone', 'device', 'smart home', 'camera', 'gaming'],
        fashion: ['fashion', 'clothing', 'apparel', 'dress', 'shoe', 'streetwear', 'shirt', 'wear'],
        beauty: ['beauty', 'skin', 'skincare', 'makeup', 'cosmetic', 'serum'],
        home: ['home', 'furniture', 'decor', 'interior', 'living room', 'sofa', 'lamp'],
        food: ['food', 'snack', 'bakery', 'coffee', 'drink', 'restaurant', 'meal', 'cooking'],
        jewelry: ['jewelry', 'jewellery', 'watch', 'accessory', 'accessories', 'bracelet', 'necklace'],
        playful: ['toy', 'gift', 'cute', 'kawaii', 'art', 'craft', 'plush']
      };
      for (const k in words)
        for (const term of words[k])
          if (t.includes(term)) scores[k] += term.split(' ').length > 1 ? 2 : 1;
      let winner = Object.entries(scores).sort((a, b) => b[1] - a[1])[0];
      return winner[1] ? storeOnboardingCopy[winner[0]] : storeOnboardingCopy.default
    }
