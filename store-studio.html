      let preset = detectStorePreset(raw),
        t = raw.toLowerCase();
      let overlay = document.getElementById('storeOnboarding');
      let gen = document.getElementById('onboardGenerating');
      if (gen) gen.style.display = 'block';
      let buttons = overlay?.querySelector('.onboard-actions');
      if (buttons) buttons.style.display = 'none';
      setTimeout(() => {
        snapshot();
        theme = preset.theme;
        edits.brand = preset.brand;
        edits.heroTitle = preset.title;
        edits.heroSub = preset.sub;
        edits.button = preset.button;
        edits.heroBg = preset.bg;
        edits.accent = preset.accent;
        edits.bannerText = /free shipping|shipping/i.test(t) ? 'Free shipping on selected orders' : /new|launch|collection/i.test(t) ? 'Discover the latest collection' : 'Welcome to ' + preset.brand;
        edits.storeIdea = raw;
        let selectedImage = onboardImageChoice === 'auto' ? preset.image : onboardImageChoice === 'none' ? '' : FORMA_IMAGES[onboardImageChoice];
        edits.heroImage = selectedImage;
        edits.homeImage = '';
        sections = ['Announcement bar', 'Header', 'Hero', 'Featured products', 'Brand story', 'Proof cards', 'Footer'];
        selected = 'Hero';
        localStorage.setItem('forma_onboarded', '1');
        save();
        overlay?.remove();
        render();
        toast('Store created from your brief — you can customize anything')
      }, 650)
    }

    let mTab = 'preview';

    function isMobileStudio() {
      return matchMedia('(max-width:800px)').matches
    }

    function setMTab(t) {
      mTab = t;
      const sh = document.querySelector('.editor-shell');
      if (sh) sh.dataset.mtab = t;
      document.querySelectorAll('.m-tabs button').forEach(b => b.classList.toggle('active', b.dataset.t === t));
      scrollTo(0, 0)
    }
    let _syncReady = false;
    setTimeout(() => {
      _syncReady = true
    }, 6000);
    addEventListener('message', event => {
      if (event.source !== parent || event.origin !== location.origin) return;
      const data = event.data;
      if (data?.type === 'dokkanio-studio-catalog') {
        catalogItems = Array.isArray(data.products) ? data.products : [];
        if (document.getElementById('productModal')) {
          const editing = selectedProduct;
          document.getElementById('productModal').remove();
          openProductModal(editing)
        }
        return
      }
      if (data?.type === 'dokkanio-studio-persisted') {
        if (data.error) return toast(data.error);
        return toast(data.demo ? 'Demo changes are saved on this device. Sign in to publish them.' : 'Changes published to your live storefront.')
      }
      if (data?.type === 'dokkanio-studio-product-saved' && pendingStudioProduct?.requestId === data.requestId) {
        if (data.error) {
          pendingStudioProduct = null;
          const button = document.getElementById('saveProductButton');
          if (button) {
            button.disabled = false;
            button.textContent = 'Save product'
          }
          return toast(data.error)
        }
        completeStudioProductSave(data.product || {})
      }
    });

    function studioSync() {
      if (!_syncReady) return;
      try {
        parent.postMessage({
          type: 'dokkanio-studio-save',
          state: {
            products,
            sections,
            edits,
            theme,
            savedAt: Date.now()
          }
        }, '*')
      } catch (e) {}
      try {
        localStorage.setItem('forma_savedAt', String(Date.now()))
      } catch (e) {}
    }
    addEventListener('message', e => {
      const d = e.data;
      if (d && d.type === 'dokkanio-studio-products') {
        _syncReady = true;
        if (!Array.isArray(d.products)) return;
        const old = products,
          keep = old.filter(p => !p.sid && p.catalogId && catalogItems.some(item => String(item.id) === String(p.catalogId)));
        const real = d.products.map(r => {
          const o = old.find(x => x.sid === r.sid) || {};
          return {
            ...r,
            description: r.description ?? o.description ?? '',
            variants: r.variants ?? o.variants ?? '',
            bundleProductIds: r.bundleProductIds ?? o.bundleProductIds ?? [],
            quantity_discounts: r.quantity_discounts ?? o.quantity_discounts ?? [],
            certifications: o.certifications || '',
            category: r.is_bundle ? 'Bundles' : (o.category || r.category),
            is_bundle: r.is_bundle ?? o.is_bundle ?? false,
            stock: o.stock != null ? o.stock : r.stock,
            status: o.status || r.status
          }
        });
        products = [...real, ...keep];
        if (edits.featuredIds) edits.featuredIds = edits.featuredIds.filter(id => products.some(p => p.id === id));
        try {
          localStorage.setItem('forma_products', JSON.stringify(products))
        } catch (_) {}
        render();
        return
      }
      if (!d || d.type !== 'dokkanio-studio-load' || !d.state) return;
      const s = d.state;
      let local = 0;
      try {
        local = +localStorage.getItem('forma_savedAt') || 0
      } catch (_) {}
      if ((s.savedAt || 0) <= local) return;
      if (Array.isArray(s.products) && s.products.length) products = s.products.map(p => {
        const o = products.find(x => x.id === p.id) || {};
        return {
          ...p,
          image: p.image || o.image || ''
        }
      });
      if (Array.isArray(s.sections) && s.sections.length) sections = s.sections;
      if (s.edits) {
        const o = edits;
        edits = {
          ...o,
          ...s.edits
        };
        ['heroImage', 'homeImage'].forEach(k => {
          if (!edits[k] && o[k]) edits[k] = o[k]
        })
      }
      if (s.theme) theme = s.theme;
      if (!sections.includes(selected)) selected = sections[0] || '';
      try {
        localStorage.setItem('forma_products', JSON.stringify(products));
        localStorage.setItem('forma_sections', JSON.stringify(sections));
        localStorage.setItem('forma_edits', JSON.stringify(edits));
        localStorage.setItem('forma_theme', theme);
        localStorage.setItem('forma_savedAt', String(s.savedAt))
      } catch (_) {}
      render();
      toast('Synced from your Dokkanio account')
    });

    function tagEditable() {
      const p = document.getElementById('preview');
      if (!p) return;
      const t = (el, k, sec) => {
        if (el) {
          el.dataset.edit = k;
          if (sec) el.dataset.sec = sec
        }
      };
      t(p.querySelector('.store-nav strong'), 'brand');
      p.querySelectorAll('.preview-block').forEach(b => {
        const m = (b.getAttribute('onclick') || '').match(/selectSection\('(.+?)'\)/),
          s = m && m[1];
        if (!s || s === 'Header') return;
        if (s === 'Announcement bar') t(b, 'bannerText');
        else if (s === 'Footer') {
          t(b.querySelector('h3'), 'brand');
          t(b.querySelector('p'), 'text', s)
        } else if (s === 'Image with text') {
          t(b.querySelector('h3'), 'homeImageTitle');
          t(b.querySelector('p'), 'homeImageText')
        } else {
          t(b.querySelector(':scope>h3'), 'title', s);
          t(b.querySelector(':scope>p'), 'text', s)
        }
      });
      t(p.querySelector('.hero h2'), 'heroTitle');
      t(p.querySelector('.hero p'), 'heroSub');
      t(p.querySelector('.hero .shopbtn'), 'button')
    }

    function commitEdit(el) {
      const k = el.dataset.edit,
        sec = el.dataset.sec,
        v = (el.innerText || '').replace(/\s+/g, ' ').trim();
      if (!v) {
        render();
        return
      }
      snapshot();
      if (k === 'title' || k === 'text') {
        const f = k === 'title' ? 'sectionTitles' : 'sectionTexts';
        edits[f] = {
          ...(edits[f] || {}),
          [sec]: v
        }
      } else edits[k] = v;
      save();
      render();
      toast('Text updated')
    }

    function startInlineEdit(el) {
      if (el.isContentEditable) return;
      try {
        el.contentEditable = 'plaintext-only'
      } catch (e) {}
      if (!el.isContentEditable) el.contentEditable = 'true';
      el.spellcheck = false;
      el.focus();
      const r = document.createRange();
      r.selectNodeContents(el);
      const g = getSelection();
      g.removeAllRanges();
      g.addRange(r);
      let done = false;
      const fin = ok => {
        if (done) return;
        done = true;
        el.contentEditable = 'false';
        ok ? commitEdit(el) : render()
      };
      el.onblur = () => fin(true);
      el.onkeydown = e => {
        e.stopPropagation();
        if (e.key === 'Escape') {
          e.preventDefault();
          fin(false)
        } else if (e.key === 'Enter' && (!e.shiftKey || e.ctrlKey || e.metaKey)) {
          e.preventDefault();
          el.blur()
        }
      }
    }
    addEventListener('dblclick', e => {
      const el = e.target.closest && e.target.closest('#preview [data-edit]');
      if (el) {
        e.preventDefault();
        startInlineEdit(el)
      }
    });
    let _lt = 0,
      _lk = '';
    addEventListener('pointerup', e => {
      if (e.pointerType === 'mouse') return;
      const el = e.target.closest && e.target.closest('#preview [data-edit]');
      if (!el) {
        _lk = '';
        return
      }
      const k = el.dataset.edit + '|' + (el.dataset.sec || ''),
        n = Date.now();
      if (k === _lk && n - _lt < 400) {
        _lk = '';
        startInlineEdit(el)
      } else {
        _lk = k;
        _lt = n
      }
    });
    addEventListener('keydown', e => {
      if (!(e.ctrlKey || e.metaKey)) return;
      const t = e.target;
      if (t.isContentEditable || /INPUT|TEXTAREA|SELECT/.test(t.tagName)) return;
      const k = e.key.toLowerCase();
      if (k === 'z') {
        e.preventDefault();
        e.shiftKey ? redo() : undo()
      } else if (k === 'y') {
        e.preventDefault();
        redo()
      } else if (k === 's') {
        e.preventDefault();
        save();
        toast('Publishing changes…')
      }
    });

    function addSection() {
      document.getElementById('addSecModal')?.remove();
      const o = ['Image with text', 'FAQ', 'Newsletter', 'Collection grid', 'Video', 'Custom content', 'Contact', 'Proof cards'];
      const m = document.createElement('div');
      m.className = 'modal-backdrop';
      m.id = 'addSecModal';
      m.onclick = e => {
        if (e.target === m) m.remove()
      };
      m.innerHTML = '<div class="modal"><div class="modal-head"><h2>Add section</h2><button onclick="document.getElementById(\'addSecModal\').remove()">✕</button></div><div class="sec-choices">' + o.map(n => '<button class="btn secondary" data-n="' + n + '">' + n + '</button>').join('') + '</div></div>';
      m.querySelectorAll('[data-n]').forEach(b => b.onclick = () => {
        snapshot();
        sections.push(b.dataset.n);
        selected = b.dataset.n;
        save();
        m.remove();
        render();
        toast('Added ' + b.dataset.n)
      });
      document.body.append(m)
    }

    render();
    openStoreOnboarding();
    try {
      parent.postMessage({
        type: "dokkanio-studio-ready"
      }, "*")
    } catch (e) {}

    </script>
  </body>

</html>
