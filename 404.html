    <script>
    const patches = [
      ['Patch 1a (Add AI Store Wizard button in Studio)', 'p1a'],
      ['Patch 1b (Show AI Store Wizard on new stores)', 'p1b'],
      ['Patch 2 (Allow clearing banner & announcement in saveStoreToSupabase)', 'p2'],
      ['Patch 3 (Keep preset/uploaded images & bundle metadata)', 'p3'],
      ['Patch 4 (Save Studio banner & starter bundles/products)', 'p4'],
      ['Patch 5 (Sync stub inputs so old values do not overwrite)', 'p5']
    ];
    let sourceText = '';
    const fileInp = document.getElementById('fileInp');
    const buildBtn = document.getElementById('buildBtn');
    const log = document.getElementById('log');

    fileInp.onchange = async () => {
      const f = fileInp.files[0];
      if (!f) return;
      sourceText = (await f.text()).replace(/\r\n/g, '\n');
      buildBtn.disabled = false;
      log.textContent = `Loaded ${f.name} (${sourceText.length.toLocaleString()} chars). Click "Patch & Download index.html".`;
    };

    buildBtn.onclick = () => {
      let out = sourceText;
      const lines = [];
      let okAll = true;
      for (const [label, id] of patches) {
        const find = document.getElementById(id + '-f').textContent;
        const rep = document.getElementById(id + '-r').textContent;
        const idx = out.indexOf(find);
        if (idx === -1) {
          lines.push('FAILED: ' + label);
          okAll = false;
        } else {
          out = out.slice(0, idx) + rep + out.slice(idx + find.length);
          lines.push('OK: ' + label);
        }
      }
      log.textContent = lines.join('\n') + '\n\n' + (okAll ? 'All patches applied! Downloading index.html...' : 'Some patches did not match.');
      if (!okAll) return;
      const blob = new Blob([out], {
        type: 'text/html;charset=utf-8'
      });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'index.html';
      a.click();
    };

    </script>
